<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
     <link rel="stylesheet" href="css/style.css">
    <title>Самый тупой тест</title>
</head>
<body>
    <main class="test">
        <div class="test-card">
            <!-- =================================
                 WELCOME
            ================================= -->
            <section class="welcome" id="welcome">
                <div class="welcome-content">
                    <h1>
                        Привет, сейчас будет самый тупой тест который ты когда-либо проходила
                    </h1>
                </div>
                <button class="start-button" id="startButton">
                    <span>
                        Начать тест
                    </span>
                    <span class="start-arrow">
                        →
                    </span>
                </button>
            </section>
<!-- =================================
     TEST
================================= -->
<section class="test-content" id="testContent">

    <header class="test-header">
        <span class="test-label">
            Тест
        </span>

        <span class="test-number" id="questionNumber">
            01 / 06
        </span>
    </header>

    <section class="question">
        <h1 id="questionText"></h1>
    </section>

    <div class="question-media" id="questionMedia"></div>

    <div class="answers" id="answers"></div>

</section>
<!-- =================================
     RESULT
================================= -->
<section class="result" id="result">

    <div class="result-content">

        <span class="result-label">
            Результат
        </span>

        <h1 id="resultTitle">
            100 из 100
        </h1>

        <p id="resultText">
            ВАУ, ты прошла самый крутой тест ага, ага.
        </p>

        <div class="result-next">
            <p>
                Остался супер вопрос, готова?
            </p>

            <button class="result-button" id="resultButton">
                <span>Гоу</span>
                <span>→</span>
            </button>
        </div>

    </div>

</section>
<!-- =================================
     RIZZ
================================= -->

<section class="rizz" id="rizz">

    <div class="rizz-content">

        <!-- FIRST QUESTION -->
        <div class="rizz-state is-active" id="rizzQuestion">

            <div class="rizz-media">
                <img src="images/rizz.gif" alt="">
            </div>

            <h1>Гоу вместе по кофе?</h1>

            <div class="rizz-choices">
                <button class="rizz-choice-button" id="rizzYes">
                    Да
                </button>

                <button class="rizz-choice-button rizz-no-button" id="rizzNo">
                    Нет
                </button>
            </div>

        </div>

        <!-- SECOND QUESTION -->
        <div class="rizz-state" id="rizzConfirm">

            <div class="rizz-media">
                <img src="images/rizz2.webp" alt="">
            </div>

            <h1>Точно?</h1>

            <div class="rizz-choices">
                <button class="rizz-choice-button" id="rizzConfirmYes">
                    Да
                </button>

                <button class="rizz-choice-button rizz-no-button" id="rizzConfirmNo">
                    передумала
                </button>
            </div>

        </div>

        <!-- FINAL YES -->
        <div class="rizz-state" id="rizzInvite">

            <div class="rizz-media">
                <img src="images/rizz1.gif" alt="">
            </div>

            <h1>Круто, гаааз</h1>

            <a
                class="rizz-button"
                href="https://t.me/twilast"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span>Жду ответ в тг</span>
                <i class="fa-brands fa-telegram"></i>
            </a>

        </div>

        <!-- FINAL NO -->
        <div class="rizz-state" id="rizzDecline">

            <div class="rizz-media">
                <img src="images/rizz2.webp" alt="">
            </div>

            <h1>sorry</h1>

        </div>

    </div>

</section>


        </div>
    </main>
<script src="js/main.js"></script>
</body>
</html>
